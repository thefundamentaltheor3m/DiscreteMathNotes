# Takes down the Pages directory that publish-latex.yml created for a pull
# request, so previews do not outlive the pull requests that produced them.

name: Remove PR preview

on:
  pull_request:
    types: [ closed ]

permissions:
  contents: read

jobs:
  cleanup:
    name: Remove the preview directory
    # Fork pull requests never got a preview: their token cannot push.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Shared with the deploying jobs in publish-latex.yml.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Remove the preview
        id: remove
        env:
          PREVIEW_DIR: preview-${{ github.event.pull_request.number }}
        run: |
          if [ ! -d "$PREVIEW_DIR" ]; then
            echo "$PREVIEW_DIR does not exist; nothing to remove."
            echo "removed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --quiet "$PREVIEW_DIR"
          git commit -m "Remove preview for PR #${{ github.event.pull_request.number }}"
          git push origin gh-pages
          echo "removed=true" >> "$GITHUB_OUTPUT"

      - name: Note the removal on the pull request
        if: steps.remove.outputs.removed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- latex-pdf-preview -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body.includes(marker));
            if (!existing) return;

            await github.rest.issues.updateComment({
              ...context.repo,
              comment_id: existing.id,
              body: [
                marker,
                '📄 The PDF preview for this pull request has been removed.',
                '',
                context.payload.pull_request.merged
                  ? `The notes are published at https://${context.repo.owner}.github.io/${context.repo.repo}/main.pdf.`
                  : 'It was built from an unmerged branch, so there is nothing left to link to.',
              ].join('\n'),
            });
